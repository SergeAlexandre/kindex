name: docker-buildx

# Build and push the multi-arch image on every push to this branch.
# Delegates the actual work to `make docker-buildx`, which builds for
# $(PLATFORMS) and pushes to $(REGISTRY)/exec/kindex.
on:
  push:
    branches:
      - build/registry-conf

# Image/chart registry. Overridable repo-wide via the `REGISTRY` variable
# (Settings > Secrets and variables > Actions > Variables);
env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  docker-buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest already ships make, go and docker; this only adds the
      # bits `make docker-buildx` needs for cross-platform builds.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derive the registry host (e.g. quay.io) from REGISTRY for the login.
      - name: Resolve registry host
        id: reg
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: make docker-buildx
        run: make docker-buildx REGISTRY="${REGISTRY}"

      - name: make chart
        run: make chart REGISTRY="${REGISTRY}"
